[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "aksum-messagebench"
version = "0.1.0a2"
description = "Offline, adapter-neutral declared financial-message preservation checks"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "third-party/*"]
dependencies = ["lxml==6.1.3", "jsonschema==4.26.0"]

[project.scripts]
messagebench = "aksum_messagebench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aksum_messagebench"]
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "aksum_messagebench/data/schemas"
"contracts" = "aksum_messagebench/data/contracts"
"corpus" = "aksum_messagebench/data/corpus"

[tool.hatch.build.targets.sdist]
include = ["src", "schemas", "contracts", "corpus", "tests", "scripts", "docs", "evidence", "examples", "*.md", "*.txt", "LICENSE", "NOTICE", "third-party", "pyproject.toml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.coverage.run]
branch = true
source = ["aksum_messagebench"]
[tool.coverage.report]
show_missing = true
