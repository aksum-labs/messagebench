name: Scheduled security
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scorecard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc
        with:
          results_file: scorecard-results.json
          results_format: json
          publish_results: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scorecard-results
          path: scorecard-results.json
          retention-days: 30
  parser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r dependency-lock-hashed.txt
      - name: Build reviewed native XML dependencies
        run: python scripts/build_native.py --archives "$RUNNER_TEMP/messagebench-native-sources" --out "$RUNNER_TEMP/messagebench-native-wheels" --download
      - name: Install local native wheel
        run: python -m pip install --no-index --no-deps --force-reinstall --require-hashes --find-links "$RUNNER_TEMP/messagebench-native-wheels" -r "$RUNNER_TEMP/messagebench-native-wheels/install-requirements.txt"
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python fuzz/smoke.py --iterations 100000
      - run: python fuzz/contracts.py --iterations 10000
