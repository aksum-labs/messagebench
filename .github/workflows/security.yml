name: Scheduled security
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r dependency-lock-hashed.txt
      - name: Build reviewed native XML dependencies
        run: python scripts/build_native.py --archives "$RUNNER_TEMP/messagebench-native-sources" --out "$RUNNER_TEMP/messagebench-native-wheels" --download
      - name: Install local native wheel
        run: python -m pip install --no-index --no-deps --force-reinstall --require-hashes --find-links "$RUNNER_TEMP/messagebench-native-wheels" -r "$RUNNER_TEMP/messagebench-native-wheels/install-requirements.txt"
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Longer deterministic parser campaign
        run: |
          mkdir -p "$RUNNER_TEMP/security-evidence"
          python fuzz/smoke.py --iterations 100000 > "$RUNNER_TEMP/security-evidence/parser-summary.txt" 2>&1
      - name: Longer contract campaign
        if: ${{ !cancelled() }}
        run: python fuzz/contracts.py --iterations 10000 > "$RUNNER_TEMP/security-evidence/contract-summary.json" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scheduled-synthetic-fuzz-evidence
          path: ${{ runner.temp }}/security-evidence
          retention-days: 14
  python-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r dependency-lock-hashed.txt
      - name: Dated Python package advisory check
        run: python scripts/scheduled_audit.py --out "$RUNNER_TEMP/advisory-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scheduled-python-advisories
          path: ${{ runner.temp }}/advisory-evidence
          retention-days: 30

  coverage-guided:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r dependency-lock-hashed.txt
      - run: python scripts/build_native.py --archives "$RUNNER_TEMP/native-sources" --out "$RUNNER_TEMP/native-wheels" --download
      - run: python -m pip install --no-index --no-deps --force-reinstall --require-hashes --find-links "$RUNNER_TEMP/native-wheels" -r "$RUNNER_TEMP/native-wheels/install-requirements.txt"
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip install --require-hashes --no-deps -r fuzz/coverage-guided-lock.txt
      - name: Exercise real parser, contract, comparator and extraction boundaries
        env:
          MESSAGEBENCH_FUZZ_COUNTS: ${{ runner.temp }}/guided-fuzz/counts.json
        run: |
          mkdir -p "$RUNNER_TEMP/guided-fuzz/corpus" "$RUNNER_TEMP/guided-fuzz/crashes"
          cp fuzz/coverage-guided/seeds/* "$RUNNER_TEMP/guided-fuzz/corpus/"
          python fuzz/coverage_guided.py -runs=100000 -max_len=16384 -timeout=10 -rss_limit_mb=1024 \
            -artifact_prefix="$RUNNER_TEMP/guided-fuzz/crashes/" "$RUNNER_TEMP/guided-fuzz/corpus" \
            > "$RUNNER_TEMP/guided-fuzz/summary.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coverage-guided-synthetic-fuzz
          path: ${{ runner.temp }}/guided-fuzz
          retention-days: 14

  clusterfuzzlite:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build pinned ClusterFuzzLite Python 3.12 environment
        run: docker build -f .clusterfuzzlite/Dockerfile -t messagebench-cfl .
      - name: Compile native XML stack and freeze real fuzz boundary
        env:
          FUZZING_LANGUAGE: python
        run: |
          mkdir -p "$RUNNER_TEMP/cfl/out" "$RUNNER_TEMP/cfl/work"
          docker run --rm -e FUZZING_LANGUAGE=python -e SANITIZER=address \
            -v "$RUNNER_TEMP/cfl/out:/out" -v "$RUNNER_TEMP/cfl/work:/work" messagebench-cfl compile \
            > "$RUNNER_TEMP/cfl/compile.log" 2>&1
      - name: Bounded coverage-guided campaign without issue or comment creation
        run: |
          mkdir -p "$RUNNER_TEMP/cfl/out/corpus" "$RUNNER_TEMP/cfl/out/crashes"
          cp fuzz/coverage-guided/seeds/* "$RUNNER_TEMP/cfl/out/corpus/"
          docker run --rm -e MESSAGEBENCH_FUZZ_COUNTS=/out/boundary-counts.json \
            -v "$RUNNER_TEMP/cfl/out:/out" messagebench-cfl \
            /out/coverage_guided -runs=10000 -max_len=16384 -timeout=10 -rss_limit_mb=1024 \
            -artifact_prefix=/out/crashes/ /out/corpus > "$RUNNER_TEMP/cfl/run.log" 2>&1
      - name: Make only synthetic findings readable for artifact collection
        if: always()
        run: sudo chmod -R a+rX "$RUNNER_TEMP/cfl" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: clusterfuzzlite-synthetic-findings
          path: |
            ${{ runner.temp }}/cfl/compile.log
            ${{ runner.temp }}/cfl/run.log
            ${{ runner.temp }}/cfl/out/boundary-counts.json
            ${{ runner.temp }}/cfl/out/corpus
            ${{ runner.temp }}/cfl/out/crashes
          retention-days: 14
