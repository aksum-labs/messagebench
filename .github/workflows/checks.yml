name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r dependency-lock-hashed.txt
      - name: Build reviewed native XML dependencies
        run: python scripts/build_native.py --archives "$RUNNER_TEMP/messagebench-native-sources" --out "$RUNNER_TEMP/messagebench-native-wheels" --download
      - name: Install local native wheel
        run: python -m pip install --no-index --no-deps --force-reinstall --require-hashes --find-links "$RUNNER_TEMP/messagebench-native-wheels" -r "$RUNNER_TEMP/messagebench-native-wheels/install-requirements.txt"
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check src tests scripts fuzz
      - run: ruff format --check src tests scripts fuzz
      - run: mypy src
      - run: python scripts/fetch_dev_tools.py --out "$RUNNER_TEMP/dev-tools" actionlint
      - run: '"$RUNNER_TEMP/dev-tools/actionlint/actionlint" .github/workflows/*.yml'
      - run: python scripts/check_secrets.py
      - run: python scripts/check_licenses.py
      - run: python scripts/check_recognition.py
      - run: python scripts/inventory.py --out "$RUNNER_TEMP/inventory"
      - run: coverage run -m pytest -q
      - run: coverage json -o coverage-ci.json
      - run: python scripts/check_coverage.py coverage-ci.json
      - run: python fuzz/smoke.py --iterations 1000
      - run: python fuzz/contracts.py --iterations 1000
      - run: bandit -r src -ll
      - run: messagebench corpus verify corpus/index.json
      - run: messagebench corpus verify corpus/extended/index.json --contract contracts/pacs008-extended.json
      - run: messagebench corpus verify corpus/pacs002/index.json --contract contracts/pacs002-preserve.json
      - run: python scripts/differential_xsd.py
      - run: python scripts/security_corpus.py
      - run: python scripts/mutations.py
      - run: python -m build --no-isolation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-test-coverage
          path: |
            coverage-ci.json
            ${{ runner.temp }}/inventory
          retention-days: 14
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r dependency-lock-hashed.txt
      - run: pip-audit --strict --disable-pip --no-deps -r dependency-lock.txt
