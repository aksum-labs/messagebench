name: Publish independently reviewed release candidate
on:
  push:
    tags:
      - v0.2.0-rc.1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/tags/v0.2.0-rc.1' && vars.REVIEWED_RELEASE_ENABLED == 'true'
    environment: release-review
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/review_packet.py verify
      - run: python -m pip install --require-hashes -r dependency-lock-hashed.txt
      - run: python scripts/build_native.py --archives "$RUNNER_TEMP/native-sources" --out "$RUNNER_TEMP/native-wheels" --download
      - run: python -m pip install --no-index --no-deps --force-reinstall --require-hashes --find-links "$RUNNER_TEMP/native-wheels" -r "$RUNNER_TEMP/native-wheels/install-requirements.txt"
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check src tests scripts fuzz
      - run: mypy src
      - run: pytest -q
      - run: python scripts/check_secrets.py
      - run: python scripts/check_licenses.py
      - run: messagebench corpus verify
      - run: python scripts/reproducible_build.py "$RUNNER_TEMP/release-artifacts" --require-clean
      - run: python scripts/prepare_bundle.py --release "$RUNNER_TEMP/release-artifacts" --native "$RUNNER_TEMP/native-wheels" --archives "$RUNNER_TEMP/native-sources" --out "$RUNNER_TEMP/review-bundle"
      - run: python scripts/inventory.py --out "$RUNNER_TEMP/hosted-inventory"
      - run: cp "$RUNNER_TEMP/hosted-inventory/sbom.cdx.json" "$RUNNER_TEMP/review-bundle/sbom.cdx.json"
      - run: python scripts/release_provenance.py --bundle "$RUNNER_TEMP/review-bundle"
      - name: Fresh offline installation
        run: |
          python -m venv "$RUNNER_TEMP/install-check"
          "$RUNNER_TEMP/install-check/bin/python" -m pip install --no-index --find-links "$RUNNER_TEMP/review-bundle/wheelhouse" --require-hashes -r "$RUNNER_TEMP/review-bundle/install-requirements.txt"
          python scripts/verify_offline_install.py --python "$RUNNER_TEMP/install-check/bin/python" > "$RUNNER_TEMP/review-bundle/offline-install-check.json"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/install-check/bin/messagebench" corpus verify
      - run: python scripts/release_provenance.py --bundle "$RUNNER_TEMP/review-bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-tag-release-bundle
          path: ${{ runner.temp }}/review-bundle
          retention-days: 30
  sign:
    needs: prepare
    if: github.ref == 'refs/tags/v0.2.0-rc.1' && vars.REVIEWED_RELEASE_ENABLED == 'true'
    environment: release-review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/fetch_dev_tools.py --out "$RUNNER_TEMP/dev-tools" cosign
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unsigned-tag-release-bundle
          path: ${{ runner.temp }}/review-bundle
      - name: Verify public artifact checksums before signing
        working-directory: ${{ runner.temp }}/review-bundle
        run: sha256sum -c SHA256SUMS
      - name: Sign reviewed tag manifest with GitHub OIDC
        working-directory: ${{ runner.temp }}/review-bundle
        run: '"$RUNNER_TEMP/dev-tools/cosign-linux-amd64" sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS'
      - name: Verify exact workflow identity
        working-directory: ${{ runner.temp }}/review-bundle
        env:
          EXPECTED_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-reviewed-release.yml@refs/tags/v0.2.0-rc.1
        run: |
          "$RUNNER_TEMP/dev-tools/cosign-linux-amd64" verify-blob \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "$EXPECTED_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
      - uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad
        with:
          subject-path: '${{ runner.temp }}/review-bundle/SHA256SUMS'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-tag-release-bundle
          path: ${{ runner.temp }}/review-bundle
          retention-days: 30
  publish:
    needs: sign
    if: github.ref == 'refs/tags/v0.2.0-rc.1' && vars.REVIEWED_RELEASE_ENABLED == 'true'
    environment: release-review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/review_packet.py verify
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed-tag-release-bundle
          path: ${{ runner.temp }}/release-bundle
      - name: Verify checksums and package the offline bundle
        working-directory: ${{ runner.temp }}/release-bundle
        run: |
          sha256sum -c SHA256SUMS
          python -m zipfile -c "$RUNNER_TEMP/messagebench-0.2.0-rc.1-offline.zip" .
          sha256sum "$RUNNER_TEMP/messagebench-0.2.0-rc.1-offline.zip" > "$RUNNER_TEMP/offline-archive.sha256"
      - name: Publish prerelease assets after protected approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.2.0-rc.1 --verify-tag --prerelease \
            --title 'MessageBench 0.2.0-rc.1' --notes-file docs/release-notes-0.2.0-rc.1.md \
            "$RUNNER_TEMP/release-bundle"/*.whl \
            "$RUNNER_TEMP/release-bundle"/*.tar.gz \
            "$RUNNER_TEMP/release-bundle/SHA256SUMS" \
            "$RUNNER_TEMP/release-bundle/SHA256SUMS.sigstore.json" \
            "$RUNNER_TEMP/release-bundle/sbom.cdx.json" \
            "$RUNNER_TEMP/release-bundle/provenance.json" \
            "$RUNNER_TEMP/messagebench-0.2.0-rc.1-offline.zip" \
            "$RUNNER_TEMP/offline-archive.sha256"
# Not executed or approved. Enable only after authentic human review and actual environment protection.
# A source tag may be created only by the company publisher after owner review authorization.
